name: Build WiX Toolset v6

on:
  push:
    branches:
      - BuildTestv6
    tags:
      - v**
  pull_request:
    branches:
      - BuildTestv6
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_XMLDOC_MODE: skip

jobs:
  build:
    name: Build
    runs-on: windows-2022
    env:
      SignBuild: false
      WixOfficialBuild: false
    permissions:
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure automated logging and crash dumps
        shell: cmd
        run: |
          reg add HKLM\Software\Policies\Microsoft\Windows\Installer /t REG_SZ /v Logging /d voicewarmupx /f
          reg add HKLM\Software\WOW6432Node\Policies\Microsoft\Windows\Installer /t REG_SZ /v Logging /d voicewarmupx /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" /t REG_EXPAND_SZ /v DumpFolder /d "%CD%\build\logs\crashdumps" /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" /t REG_DWORD /v DumpCount /d 10 /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" /t REG_DWORD /v DumpType /d 1 /f
          reg add "HKLM\SOFTWARE\WOW6432Node\Microsoft\Windows\Windows Error Reporting\LocalDumps" /t REG_EXPAND_SZ /v DumpFolder /d "%CD%\build\logs\crashdumps" /f
          reg add "HKLM\SOFTWARE\WOW6432Node\Microsoft\Windows\Windows Error Reporting\LocalDumps" /t REG_DWORD /v DumpCount /d 10 /f
          reg add "HKLM\SOFTWARE\WOW6432Node\Microsoft\Windows\Windows Error Reporting\LocalDumps" /t REG_DWORD /v DumpType /d 1

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install .NET prerequisites
        shell: pwsh
        run: |
          # Use dotnet tool to install required prerequisites
          Write-Host "Installing .NET Desktop Runtime prerequisites..."
          
          # Download from Microsoft's official CDN with specific version
          $dotnetPrereqUrl = "https://download.microsoft.com/download/0/5/4/05413EB9-EA00-44FA-ABAB-1D43BFCA9D6F/windowsdesktop-runtime-9.0.0-win-x64.exe"
          $dotnetPrereqPath = "$env:TEMP\windowsdesktop-runtime.exe"
          
          try {
            Write-Host "Downloading .NET prerequisites..."
            Invoke-WebRequest -Uri $dotnetPrereqUrl -OutFile $dotnetPrereqPath -TimeoutSec 300
            
            Write-Host "Installing .NET prerequisites..."
            & $dotnetPrereqPath /quiet /norestart
            
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Installation exit code: $LASTEXITCODE"
            }
          }
          finally {
            Remove-Item -Path $dotnetPrereqPath -Force -ErrorAction SilentlyContinue
          }
            
      - name: Remove .NET SDK 10.0 to prevent MSBuild conflicts
        shell: pwsh
        run: |
          # Remove any .NET 10.x SDK that conflicts with MSBuild 17
          $sdkPath = "C:\Program Files\dotnet\sdk"
          Get-ChildItem $sdkPath -Directory | Where-Object { $_.Name -like "10.*" } | ForEach-Object {
            Write-Host "Removing SDK: $($_.FullName)"
            Remove-Item $_.FullName -Recurse -Force
          }
          dotnet --list-sdks

      - name: Build wix6
        shell: cmd
        run: ./src/build_official.cmd
        env:
          RuntimeTestsEnabled: true

      - name: Validate test results
        if: ${{ !cancelled() }}
        shell: cmd
        run: |
          if exist src\testresultfilelist.txt (
            7z a build\testresults.zip @src\testresultfilelist.txt
          ) else (
            echo No testresultfilelist.txt found, skipping.
          )

      - name: Save build
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: build/artifacts/

      - name: Collect integration test logs
        if: ${{ !cancelled() }}
        shell: cmd
        run: 7z a "build\logs\test_burn_%GITHUB_RUN_ID%.zip" "%TEMP%\*.log" "%TEMP%\..\*.log"

      - name: Export Application event log
        if: ${{ !cancelled() }}
        shell: cmd
        run: wevtutil epl Application build\logs\Application.evtx /q:"Event/System/TimeCreated[timediff(@SystemTime) <= 86400000]"

      - name: Export System event log
        if: ${{ !cancelled() }}
        shell: cmd
        run: wevtutil epl System build\logs\System.evtx /q:"Event/System/TimeCreated[timediff(@SystemTime) <= 86400000]"

      - name: Save logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: logs_${{ github.run_id }}
          path: build/logs/

      - name: Push to GitHub Packages
        if: ${{ github.event_name == 'push' }}
        run: dotnet nuget push "build/artifacts/**/*.nupkg" --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
